events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # DNS резолвер для Docker сети
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # Переменная для WebSocket upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Rate limiting зоны
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=static:10m rate=50r/s;

    # Расширенный формат логов с таймингами
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Улучшенное сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/xml font/truetype font/opentype image/svg+xml;
    gzip_disable "msie6";

    # HTTP → HTTPS редирект
    server {
        listen 80;
        server_name clientix.uz www.clientix.uz;
        
        # Редирект на HTTPS
        return 301 https://$server_name$request_uri;
        
        # Для Let's Encrypt renewal (если используете веб-рут)
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }
    }

    # HTTPS сервер
    server {
        listen 443 ssl http2;
        server_name clientix.uz www.clientix.uz;
        
        # SSL сертификаты (должны быть проброшены в контейнер)
        # Если сертификаты отсутствуют, nginx не запустится
        # Для разработки можно использовать self-signed сертификаты
        ssl_certificate /etc/letsencrypt/live/clientix.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/clientix.uz/privkey.pem;
        
        # Fallback для отсутствующих сертификатов (раскомментируйте для разработки)
        # ssl_certificate /etc/nginx/ssl/cert.pem;
        # ssl_certificate_key /etc/nginx/ssl/key.pem;
        
        # Улучшенные SSL настройки безопасности
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # Заголовки безопасности
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self';" always;

        # Блокировка скрытых файлов
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Кэширование статических файлов
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            set $backend "http://gateway:3000";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Кэширование на 30 дней
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";

            # Rate limiting для статики
            limit_req zone=static burst=100 nodelay;
        }

        # Health check endpoint (быстрая проверка доступности gateway)
        location /health {
            set $backend "http://gateway:3000";
            proxy_pass $backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Короткие таймауты для health check
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;

            # Не кэшируем health check
            proxy_cache off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";

            # Отключаем логирование для health check
            access_log off;
        }

        # Rate limiting для auth эндпоинтов
        location ~ ^/api/(login|register) {
            set $backend "http://gateway:3000";
            proxy_pass $backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Строгий rate limiting для auth
            limit_req zone=login burst=5 nodelay;

            proxy_http_version 1.1;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Основной location для всех остальных запросов
        location / {
            set $backend "http://gateway:3000";
            proxy_pass $backend;

            # Основные заголовки для reverse proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;

            # Для WebSocket (если используется)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Таймауты для proxy (увеличены для стабильности)
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            send_timeout 120s;

            # Буферизация (включена для производительности)
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            proxy_max_temp_file_size 0;

            # Rate limiting для API
            limit_req zone=api burst=20 nodelay;

            # Обработка ошибок
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;

            # Обработка ошибок подключения
            proxy_intercept_errors on;
            error_page 502 503 504 = @gateway_error;
        }
        
        # Обработчик ошибок gateway
        location @gateway_error {
            default_type application/json;
            return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен. Пожалуйста, попробуйте позже."}}';
        }

        # Для Let's Encrypt renewal
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }
    }
}

